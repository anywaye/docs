---
name: external-links

on:
  push:
    branches: [master]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: external links (liveness)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: bin/check-external-links
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/external-links.log"
          status=0
          ./bin/check-external-links --timeout 10000 2>&1 | tee "$log" || status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::bin/check-external-links exited $status — see the names below" >&2
            exit "$status"
          fi

      - name: what actually ran
        shell: bash
        env:
          LOG: ${{ runner.temp }}/external-links.log
        run: |
          set -euo pipefail
          count() { grep -E "^$1: [0-9]+$" "$LOG" | tail -1 | cut -d: -f2 | tr -d ' '; }
          ok="$(count ok)"; redirect="$(count redirect)"
          broken="$(count broken)"; unreachable="$(count unreachable)"
          for pair in "ok:$ok" "redirect:$redirect" "broken:$broken" "unreachable:$unreachable"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::could not read the '${pair%%:*}' count out of $LOG." >&2
              echo "  A checker whose result cannot be read is not a checker." >&2
              tail -20 "$LOG" >&2 || true
              exit 1
            fi
          done
          {
            echo "### external links — what ran"
            echo
            echo "| outcome | count |"
            echo "|---|---|"
            echo "| ok (2xx) | $ok |"
            echo "| redirect (3xx) | $redirect |"
            echo "| broken (4xx/5xx) | $broken |"
            echo "| unreachable (timeout, DNS, TLS) | $unreachable |"
            echo
            echo "No retries. An unreachable link is a failure, not a skip, and not a"
            echo "second attempt — see the header of \`bin/check-external-links\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::$ok ok, $redirect redirect, $broken broken, $unreachable unreachable"
