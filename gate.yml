# gate.yml — how docs is gated, declared rather than guessed.
#
# WHY THIS FILE IS HERE. `anywaye/core` owns the format
# (`schemas/gate.schema.json`), the checker (`harness/gate_check.py`) and the
# reasoning (`docs/gate.md`). Six repositories declared their gate and this is
# the seventh. The consequence is not cosmetic: `bin/prime` exists in thirteen
# repositories and what it is *worth* was written down in six, so a developer
# here ran `bin/prime`, saw green, and learned nothing about whether it could
# detect anything. A checker here replaced by `exit 0` would have left this
# repository green. Every number below was measured on THIS tree by running the
# declared command; none of them was copied from another repository's file.
#
# WHAT THE CHECKER PROVES ABOUT THIS FILE, AND WHAT IT DOES NOT. It proves the
# command runs, the entrypoint exists and is executable, `mise run prime`
# resolves to that same file, the CI workflow really invokes the declared argv,
# and — the part that matters — that running the declared command makes each of
# the eight lines below appear, the five countable ones at or above their floors.
# It does NOT prove the tests touched `core` or the `cafe` binary it names. That
# is `tests/contracts.mjs` asserting both prerequisites in its own first two
# tests, and this file's `contract-tier-ran` proof is what makes the tier
# optional to nobody.
#
# THE THING THAT WAS WORTH MEASURING: THE THREE COMMANDS ARE NOT ONE COMMAND.
# This repository has three spellings of "run the gate", and they are not
# equal. All three were run on this tree:
#
#   mise run prime            -> ./bin/prime              16 tests, contract tier NOT run
#   CI's `gate` job           -> bin/prime                 16 tests, + 3 assertions bin/prime
#                                                            does not make (see below)
#   CI's `contracts` job      -> bin/prime --contracts     22 tests (16 offline + 6 contract)
#
# `bin/prime` says out loud that the contract tier did not run, and it is right
# to: those six tests are the only ones that can catch a documented example
# contradicting something that has actually shipped, and they need a `core`
# checkout and a `cafe` binary that a contributor with one clone does not have.
# So the flag is not a gate that is hidden behind a flag — it is a second tier
# with two real prerequisites, and CI runs it as its own job and fails the build
# if it did not run.
#
# WHY `command` IS THE FLAG AND NOT THE BARE DEFAULT. Because declaring
# `[bin/prime]` would be true and useless. The declaration would be satisfied by
# a run that checked sixteen properties of the text and validated **zero**
# manifests against core's real schema — and `gate-check --prove` would print
# green, which is the exact false green this format exists to end. `muse`'s
# declaration carries the same argument for the same reason (its three skipped
# tests are the only ones that catch vendored specs drifting), and `darkroom`'s
# declares `--db` because `./bin/prime` reports 41 `#[ignore]`d database tests
# as `ignored` and exits 0. Declaring the subset is declaring the badge.
#
# **AND THE COST, stated because it is real.** `bin/prime --contracts` is not
# what a contributor with one checkout can run. It needs `external.requirements`
# below satisfied, and this file says so rather than pretending the gate is
# hermetic. The cheap way back to the subset is to delete the `--contracts` from
# `command` and the four proofs anchored on `== npm run test:contracts`; the
# count of 16 is unaffected and the gate goes green over an unrun tier again.
#
# ── THE RED PROOFS: THIS DECLARATION HAS BEEN OBSERVED FAILING ────────────
#
# A gate that has never been seen red is not a gate. All three of these were
# run against this file on this tree, and each is a different class of defect
# rather than three copies of one. Full transcripts, including what the gate
# itself reported while the checker was red, are in `REPORT-docs-06-gate`.
#
#   1. `tests/links.mjs` and `tests/examples.mjs` removed from the `test`
#      script — the two files AGENTS.md calls "the whole deliverable".
#      **`bin/prime` exited 0**, 7 tests / 7 pass / 0 skipped. The checker said
#      `gate.floor: proof 'offline-suite' reported 7 and the declaration's floor
#      is 16`, and said *nothing else* — the absence of a `gate.nonzero` finding
#      is the record that the gate itself was green. This is the packet's own
#      premise, run: a developer deletes the checks to reach green, the local
#      gate stays green, and the declaration is what notices.
#
#   2. `CORE_PATH` pointed at an empty directory. Four findings, and the point
#      is the shape: `gate.nonzero: the gate exited 1`, `gate.floor: proof
#      'contract-tier-ran' reported 3 and the declaration's floor is 6`, and
#      `gate.proof-missing` for both `event-claims-checked` and
#      `span-names-checked`. Three of the six contract tests still passed,
#      because three of them do not read `core`. **Nothing skipped** — an
#      unreadable core is a failure that names itself, which is the property
#      `tests/contracts.mjs` was written to have and the reason it is a separate
#      tier rather than a skip.
#
#   3. **`CAF=/usr/bin/true`.** This is the one worth reading twice, because it
#      is the packet's premise verbatim: "a checker replaced by a function that
#      unconditionally exits 0 would leave this repository green."
#      It nearly did. All 22 tests passed — 16 offline, 6 contract, 0 failed, 0
#      skipped, exit 0 — including `ok 3 - every anywaye.yml example in the docs
#      passes the real cafe validator`, and the tier went on printing
#      `manifests validated by cafe contract lint: 2`. The count-based proof was
#      satisfied by the stub, because that `console.log` lives in the test and
#      not in `cafe`. The one thing that changed in the whole log is that
#      `cafe contract lint`'s own stdout line, `# OK …/anywaye.yml`, stopped being
#      printed — so the declaration reported exactly one failure,
#      `gate.proof-missing: proof 'cafe-lint-output' never appeared`, and named
#      the proof that had been defeated.
#
# That third one is why `cafe-lint-output` exists with no floor and no count in
# it. A proof that only counted things would have been green.
version: 1
name: docs

gate:
  command: [bin/prime, --contracts]
  miseTask: prime
  entrypoint: bin/prime
  timeoutSeconds: 1200
  proof:
    - id: offline-suite
      match: '(?s)^== npm test\n.*?^# pass ([0-9]+)$'
      minimum: 16
    - id: offline-no-skip
      match: '(?s)^== npm test\n.*?^# skipped 0$'
    - id: contract-tier-ran
      match: '(?s)^== npm run test:contracts.*?^# pass ([0-9]+)$'
      minimum: 7
    - id: contract-no-skip
      match: '(?s)^== npm run test:contracts.*?^# skipped 0$'
    - id: manifests-validated-by-cafe
      match: '^#.*\\# manifests validated by cafe contract lint: ([0-9]+)$'
      minimum: 2
    - id: cafe-lint-output
      match: '^#.*\\# OK \S+/anywaye\.yml$'
    - id: event-claims-checked
      match: "^#.*\\\\# event-type claims checked against core.s catalog: ([0-9]+) \\(core publishes [0-9]+\\)$"
      minimum: 9
    - id: span-names-checked
      match: "^#.*\\\\# span names checked against core.s pattern: ([0-9]+) good, [0-9]+ rejected$"
      minimum: 6

external:
  selfContained: false
  requirements:
    - kind: toolchain
      name: node 22.23.4 and the npm that ships with it, the pin in mise.toml, repeated as engines.node in package.json
      satisfy:
        command: [mise, install]
        unmet: >-
          bin/prime: node not found on PATH — run 'mise install' in this
          worktree (exit 127)
    - kind: network
      name: the npm registry, on EVERY run — the 278 packages package-lock.json pins; a warm ~/.npm cache is what makes it invisible
      satisfy:
        command: [npm, ci]
        unmet: >-
          npm error code ENOTCACHED — npm error request to
          https://registry.npmjs.org/zwitch/-/zwitch-2.0.4.tgz failed: cache
          mode is 'only-if-cached' but no cached response is available, and no
          node_modules/ is left behind (exit 1)
    # Demonstrated: `CAF=/nonexistent/cafe npm run test:contracts` fails at the
    # tier's second test and exits 1. **This is a failure and never a skip**,
    # which is the property worth declaring: a contract check that cannot find
    # the contract converts an unknown into a green badge.
    #
    # It is a `toolchain` rather than a `filesystem` requirement because it is a
    # built binary from another repository, not a checkout; CI builds it from
    # source (`git clone anywaye/cafe && go build ./cmd/cafe`) rather than
    # downloading a release, so it cannot break because a published artifact
    # disappeared.
    - kind: toolchain
      name: the cafe binary, built from a checkout of anywaye/cafe — `go build ./cmd/cafe` — on PATH or at $CAF
      satisfy:
        command: [cafe, version]
        unmet: >-
          the cafe binary (/nonexistent/cafe) could not be run: spawnSync
          /nonexistent/cafe ENOENT, and the tier exits 1 at its second test
    - kind: filesystem
      name: a readable anywaye/core checkout — $CORE_PATH, or a core directory beside this repository, holding schemas/ and docs/event-naming.md
      satisfy:
        command: [bin/prime, --contracts]
        unmet: >-
          core is not readable at /tmp/no-such-core. This tier reads core's real
          manifest schema and cannot run without it. Set CORE_PATH, or put core
          next to this worktree. (exit 1, at the tier's first test)

ci:
  workflow: ci/gate.sh
  invokes: [bin/prime, --contracts]
